[project]
name = "graph-generator"
version = "0.1.0"
description = "Grafo de citacoes para exploracao de tema de pesquisa, sobre OpenAlex"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: bate na API real do OpenAlex; rodar com -m network",
]
addopts = "-m 'not network'"

[tool.setuptools.packages.find]
include = ["app*"]
